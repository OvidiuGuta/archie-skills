name: Validate

# Strangers install this bundle from `main`, so a broken relative link or a
# reference copy left out of sync is their broken skill, not ours.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-skills.mjs
